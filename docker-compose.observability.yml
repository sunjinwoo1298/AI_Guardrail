services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai_guardrail_proxy-app:latest
    container_name: ai-guardrail-app
    env_file:
      - .env
    environment:
      # Persist the ChromaDB semantic cache across restarts.
      - CHROMA_PERSIST_DIR=/home/app/data/chroma
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - hf_cache:/home/app/.cache/huggingface
      - chroma_data:/home/app/data
    depends_on:
      - redis
      - otel-collector
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai-guardrail-redis
    ports:
      # Local-only: Redis has no password here, so never publish it on all interfaces.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ai-guardrail-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      - app

  grafana:
    image: grafana/grafana-oss:11.2.0
    container_name: ai-guardrail-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      # Set GRAFANA_ADMIN_PASSWORD in .env; "admin" is only a local-development fallback.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  otel-collector:
    image: otel/opentelemetry-collector:0.157.0
    container_name: ai-guardrail-otel-collector
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    command:
      - "--config=/etc/otelcol/config.yaml"
    depends_on:
      - jaeger

  # Trace viewer: the collector forwards OTLP traces here. UI on http://localhost:16686
  jaeger:
    image: jaegertracing/jaeger:2.1.0
    container_name: ai-guardrail-jaeger
    ports:
      - "16686:16686"
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
    container_name: ai-guardrail-frontend
    ports:
      - "5173:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  redis_data:
  hf_cache:
  chroma_data:
