name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run unit and integration tests
        run: pytest -q

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Python dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off
      - name: Build the image
        run: docker build -t ai-guardrail-proxy:ci .
      - name: Scan the image (fail on fixable critical / high)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ai-guardrail-proxy:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render the chart
        run: |
          helm lint deploy/helm/ai-guardrail-proxy
          helm template guardrail deploy/helm/ai-guardrail-proxy \
            --set secrets.existingSecret=guardrail-secrets \
            --set ingress.enabled=true --set metrics.serviceMonitor.enabled=true > /dev/null

  load-test:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run locust load test
        env:
          LOAD_TEST_TARGET: ${{ secrets.LOAD_TEST_TARGET }}
          LOAD_TEST_API_KEY: ${{ secrets.LOAD_TEST_API_KEY }}
        run: |
          if [ -z "$LOAD_TEST_TARGET" ]; then
            echo "Skipping load test because LOAD_TEST_TARGET is not set."
            exit 0
          fi
          locust -f load_test/locustfile.py --headless -u 20 -r 5 -t 5m --host "$LOAD_TEST_TARGET" --csv load_test/results
      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: load_test/results*
