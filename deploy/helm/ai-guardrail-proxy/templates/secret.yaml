{{- if and (not .Values.secrets.existingSecret) .Values.secrets.values }}
# Convenience only. In production reference an existing Secret (secrets.existingSecret)
# managed by External Secrets / Vault / your cloud's secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agp.secretName" . }}
  labels: {{- include "agp.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
