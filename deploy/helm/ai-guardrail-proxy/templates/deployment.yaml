apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agp.fullname" . }}
  labels: {{- include "agp.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels: {{- include "agp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "agp.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "agp.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 40
      containers:
        - name: proxy
          image: {{ include "agp.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          {{- include "agp.env" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 8000
          # Model warm-up can take a few minutes on first start (download + load).
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # /ready answers 503 until the injection classifier, the database and (with
          # fail-closed rate limits) Redis are available, so a pod never serves
          # unscreened traffic.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]  # let the endpoints drain before shutdown
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: model-cache
              mountPath: /home/app/.cache/huggingface
            - name: data
              mountPath: /home/app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: model-cache
          {{- if .Values.modelCache.persistentVolumeClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.modelCache.persistentVolumeClaim }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.modelCache.sizeLimit }}
          {{- end }}
        - name: data
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range .Values.topologySpreadConstraints }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels: {{- include "agp.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
